<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('linknote_theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light')}}catch(e){}})()</script>
<style>body{background:#1a1a2e}html[data-theme="light"] body{background:#f0f2f5}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__OG_TITLE__</title>
<meta name="description" content="__OG_DESC__">
<meta name="keywords" content="anonymous shared notepad, anonymous notepad, share notes anonymously, online notepad no sign up, temporary note sharing">
<meta name="robots" content="index, follow">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="__OG_TITLE__">
<meta property="og:description" content="__OG_DESC__">
<meta property="og:image" content="__OG_IMAGE__">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta property="og:url" content="__OG_URL__">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LinkedPad">
<meta property="fb:app_id" content="__FB_APP_ID__">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@LinkedPad">
<meta name="twitter:title" content="__OG_TITLE__">
<meta name="twitter:description" content="__OG_DESC__">
<meta name="twitter:image" content="__OG_IMAGE__">
<link rel="canonical" href="__OG_URL__">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script type="application/ld+json">__JSON_LD__</script>
<link rel="stylesheet" href="/css/style.css">
<style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}</style>
</head>
<body>
<h1 class="sr-only">__OG_TITLE__</h1>
<nav class="navbar">
    <a href="/" class="logo">LinkedPad <span class="logo-tagline">Anonymous Shared Notepad</span></a>
    <span id="autosave-indicator"></span>
    <div class="nav-links">
    <a href="/search" title="Search through shared notes">Search</a>
    <a href="/favorites" title="View your favorited notes">Favorites</a>
  </div>
  <button id="theme-btn" class="toolbar-btn" title="Switch between light and dark theme" aria-label="Switch between light and dark theme" data-icon="moon"></button>
</nav>
<main class="note-view-page">
  <div id="note-container" class="hidden">
    <div class="toolbar">
      <input type="text" id="title-input" class="title-input" placeholder="Title (optional)" maxlength="200" title="Edit the note title">
      <div class="toolbar-right">
        <span class="pw-wrapper">
          <button id="password-btn" class="toolbar-btn" title="Protect this note with a password" aria-label="Protect this note with a password" data-icon="lockOpen"></button>
          <div id="pw-popup" class="pw-popup">
            <div class="pw-field">
              <input type="password" id="password-input" class="pw-inline-input" placeholder="Password (min 4 chars)" maxlength="100" aria-label="Password to protect this note">
              <button id="pw-reveal-btn" class="pw-reveal-btn" title="Show password" aria-label="Show password" data-icon="eye"></button>
            </div>
            <button id="pw-ok-btn" class="btn btn-primary pw-ok-btn" title="Set this password">OK</button>
          </div>
        </span>
        <button id="mic-btn" class="toolbar-btn" title="Use speech-to-text to enter content (Chrome/Edge only)" aria-label="Use speech-to-text to enter content" style="display:none" data-icon="mic"></button>
        <button id="fav-btn" class="toolbar-btn" title="Add this note to your favorites" aria-label="Add this note to your favorites" data-icon="star"></button>
        <button id="duplicate-btn" class="toolbar-btn" title="Create a copy of this note" aria-label="Create a copy of this note" data-icon="copy"></button>
        <button id="download-btn" class="toolbar-btn" title="Download this note as a text file" aria-label="Download this note as a text file" data-icon="download"></button>
        <button id="share-btn" class="btn btn-primary" title="Share this note">Share</button>
      </div>
    </div>
    <textarea id="note-content" class="note-editor" placeholder="Loading..." maxlength="50000" title="Edit your note content here"></textarea>
    <p id="note-date" class="note-date"></p>
  </div>

  <div id="lock-screen" class="hidden" role="dialog" aria-label="Unlock note">
    <div class="lock-card">
      <div class="lock-icon" data-icon="lock"></div>
      <h2>This note is password protected</h2>
      <p>Enter the password to view this note.</p>
      <div class="lock-field">
        <input type="password" id="lock-password-input" class="lock-input" placeholder="Enter password" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Password to unlock this note">
        <button id="lock-unlock-btn" class="btn btn-primary" title="Unlock this note">Unlock</button>
      </div>
      <p id="lock-error" class="error hidden"></p>
    </div>
  </div>

  <div id="share-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Share this note</h2>
      <p>Anyone with this link can view your note</p>
      <div class="result-link">
        <input type="text" id="share-link" readonly>
        <button id="copy-share-link" class="btn btn-primary" title="Copy to clipboard">Copy</button>
      </div>
      <div class="share-buttons">
        <a id="share-twitter" href="#" target="_blank" rel="noopener" class="btn" title="Share on X (Twitter)" aria-label="Share on X (Twitter)" data-icon="twitter"></a>
        <a id="share-facebook" href="#" target="_blank" rel="noopener" class="btn" title="Share on Facebook" aria-label="Share on Facebook" data-icon="facebook"></a>
        <a id="share-whatsapp" href="#" target="_blank" rel="noopener" class="btn" title="Share on WhatsApp" aria-label="Share on WhatsApp" data-icon="whatsapp"></a>
        <a id="share-linkedin" href="#" target="_blank" rel="noopener" class="btn" title="Share on LinkedIn" aria-label="Share on LinkedIn" data-icon="linkedin"></a>
        <a id="share-reddit" href="#" target="_blank" rel="noopener" class="btn" title="Share on Reddit" aria-label="Share on Reddit" data-icon="reddit"></a>
      </div>
      <button id="close-share-modal" class="btn" title="Close" aria-label="Close" data-icon="x"></button>
    </div>
  </div>
</main>

<div id="pw-dialog" class="modal hidden">
  <div class="modal-content">
    <h2 id="pw-dialog-title">Password set</h2>
    <p id="pw-dialog-msg">This note is now protected with a password.</p>
    <button id="pw-dialog-ok" class="btn btn-primary">OK</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/js/icons.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/speech.js"></script>
<script src="/js/favorites.js"></script>
<script src="/js/note.js"></script>
</body>
</html>
